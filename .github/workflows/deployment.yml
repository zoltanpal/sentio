name: Deploy React App to Server

on:
  workflow_dispatch:
    inputs:
      deployment_env:
        description: "Select environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sentio-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_AUTH_USERNAME: ${{ secrets.VITE_AUTH_USERNAME }}
          VITE_AUTH_PASSWORD: ${{ secrets.VITE_AUTH_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_AUTH_TOKEN: ${{ secrets.VITE_API_AUTH_TOKEN }}

          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Resolve deployment path
        id: vars
        run: |
          if [ "${{ github.event.inputs.deployment_env }}" = "prod" ]; then
            echo "deploy_path=${{ secrets.PROD_SERVER_DEPLOYMENT_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=${{ secrets.DEV_SERVER_DEPLOYMENT_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ steps.vars.outputs.deploy_path }}"
            find "${{ steps.vars.outputs.deploy_path }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Upload dist folder
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "${{ steps.vars.outputs.deploy_path }}"
          strip_components: 1

      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            chown -R appuser:www-data "${{ steps.vars.outputs.deploy_path }}"
            chmod -R 755 "${{ steps.vars.outputs.deploy_path }}"